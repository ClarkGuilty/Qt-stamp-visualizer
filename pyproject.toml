[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-stamp-visualizer"
version = "0.1.0"
description = "Qt tool for the visual inspection and classification of astronomical stamps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Javier Acevedo Barroso" }]
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyside6",
    "pillow",
    "pyparsing",
    "astropy",
]

[project.urls]
Repository = "https://github.com/ClarkGuilty/Qt-stamp-visualizer"

[project.scripts]
qtstamp-mosaic = "mosaic:main"
qtstamp-single = "single_viewer:main"
qtstamp-lobby = "lobby:main"

[tool.setuptools]
py-modules = [
    "lobby",
    "mosaic",
    "single_viewer",
    "extraction",
    "extract_files_from_mosaic",
    "imaging",
    "widgets",
    "workers",
]

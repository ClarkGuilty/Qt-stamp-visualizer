[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-stamp-visualizer"
version = "0.1.0"
description = "Qt tool for the visual inspection and classification of astronomical stamps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Javier Acevedo Barroso" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyside6",
    "pillow",
    "pyparsing",
    "astropy",
]

[project.urls]
Repository = "https://github.com/ClarkGuilty/Qt-stamp-visualizer"

[project.scripts]
qtstamp-mosaic = "mosaic:main"
qtstamp-single = "single_viewer:main"
qtstamp-lobby = "lobby:main"

[tool.setuptools]
packages = ["qtstamp_defaults"]
py-modules = [
    "lobby",
    "mosaic",
    "single_viewer",
    "extraction",
    "fits_io",
    "imaging",
    "paths",
    "state",
    "widgets",
    "workers",
]

# The presets shipped as the last entry on paths.config_search_path(). Without
# this they are absent from a wheel and a pip-installed lobby shows an empty
# preset dropdown -- the same packaging hole fits_io.py fell into (PLAN.md 2b).
[tool.setuptools.package-data]
qtstamp_defaults = ["presets/*.json"]

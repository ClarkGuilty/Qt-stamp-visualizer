[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-stamp-visualizer"
version = "0.1.0"
description = "Qt tool for the visual inspection and classification of astronomical stamps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Javier Acevedo Barroso" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyside6",
    "pillow",
    "pyparsing",
    "astropy",
]

[project.urls]
Repository = "https://github.com/ClarkGuilty/Qt-stamp-visualizer"

[project.scripts]
qtstamp-mosaic = "qtstamp.mosaic:main"
qtstamp-single = "qtstamp.single_viewer:main"
qtstamp-lobby = "qtstamp.lobby:main"

# One package. The top-level lobby.py, mosaic.py and single_viewer.py are launchers
# for running from a checkout and are not installed: `qtstamp-*` replaces them.
[tool.setuptools.packages.find]
include = ["qtstamp*"]

# The presets shipped as the last entry on paths.config_search_path(). Without
# this they are absent from a wheel and a pip-installed lobby shows an empty
# preset dropdown.
[tool.setuptools.package-data]
"qtstamp.defaults" = ["presets/*.json"]
